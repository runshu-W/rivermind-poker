[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rivermind-core"
version = "0.1.0"
description = "Hand history normalization core for RiverMind Poker"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
  {name = "RiverMind Team"}
]
dependencies = []

[project.scripts]
rivermind = "rivermind_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
